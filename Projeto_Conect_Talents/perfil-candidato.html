<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulte contatos, habilidades e candidaturas do perfil no ConectaTalentos.">
  <title>Perfil do candidato — ConectaTalentos</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script>if (!AuthData.isAutenticado()) window.location.replace('login.html');</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="header-container"></div>
      <main class="page-content">
        <a class="workflow-back" href="candidatos.html">&larr; Voltar para candidatos</a>
        <div id="candidateProfile"></div>
      </main>
    </div>
  </div>

  <script src="js/hiring-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    initLayout('candidatos');

    const candidateId = new URLSearchParams(window.location.search).get('id');
    const candidateProfile = document.getElementById('candidateProfile');
    const safe = HiringData.escapeHtml;
    candidateProfile.innerHTML = '<p class="empty-message">Carregando...</p>';

    function renderApplication(application) {
      const vacancy = application.vaga;
      const pending = application.status === 'Pendente';
      const statusClass = application.status.toLowerCase();
      return `
        <article class="card profile-application">
          <div class="profile-application__vacancy">
            <div>
              <a href="detalhes-vaga.html?id=${vacancy.id}" class="profile-application__title">${safe(vacancy.titulo)}</a>
              <p>${safe(vacancy.localizacao)} <span aria-hidden="true">&middot;</span> ${safe(vacancy.tipo)}</p>
            </div>
            ${renderJobStatus(vacancy.status)}
          </div>
          <div class="application-actions">
            <span class="application-status application-status--${statusClass}">${safe(application.status)}</span>
            <div class="decision-buttons">
              <button class="btn btn--accept" type="button" data-application-id="${application.id}" data-application-action="Aceita" ${pending ? '' : 'disabled'}>Aceitar</button>
              <button class="btn btn--decline" type="button" data-application-id="${application.id}" data-application-action="Recusada" ${pending ? '' : 'disabled'}>Recusar</button>
            </div>
          </div>
        </article>
      `;
    }

    async function renderProfile() {
      const candidate = await HiringData.getCandidate(candidateId);
      if (!candidate) {
        window.location.replace('candidatos.html');
        return;
      }
      const applications = await HiringData.getApplicationsForCandidate(candidate.id);
      document.title = `${candidate.nome} — ConectaTalentos`;
      candidateProfile.innerHTML = `
        <section class="card candidate-profile-hero">
          ${HiringData.renderAvatar(candidate, 'person-avatar--large')}
          <div class="candidate-profile-identity">
            <span class="eyebrow">Perfil do candidato</span>
            <h1 class="page-title">${safe(candidate.nome)}</h1>
            <p class="page-subtitle">${safe(candidate.cargo)}</p>
          </div>
          ${renderStatusBadge(candidate.status, candidate.statusLabel)}
        </section>

        <div class="candidate-profile-grid">
          <section class="card profile-contact">
            <h2>Contato</h2>
            <dl>
              <div><dt>E-mail</dt><dd><a href="mailto:${safe(candidate.email)}">${safe(candidate.email)}</a></dd></div>
              <div><dt>Telefone</dt><dd><a href="tel:${safe(candidate.telefone.replace(/\D/g, ''))}">${safe(candidate.telefone)}</a></dd></div>
              <div><dt>Localização</dt><dd>${safe(candidate.localizacao)}</dd></div>
            </dl>
          </section>
          <section class="card profile-skills">
            <h2>Habilidades</h2>
            <div class="skill-list">${candidate.habilidades.map(skill => `<span class="skill-tag">${safe(skill)}</span>`).join('')}</div>
          </section>
        </div>

        <section class="workflow-section">
          <div class="workflow-section__heading">
            <div>
              <h2>Candidaturas</h2>
              <p>Vagas às quais este candidato se inscreveu</p>
            </div>
            <span class="badge badge--count">${applications.length}</span>
          </div>
          <div class="application-list" id="candidateApplications">
            ${applications.length ? applications.map(renderApplication).join('') : '<p class="empty-message card">Este candidato ainda não se inscreveu em vagas.</p>'}
          </div>
        </section>
      `;

      document.getElementById('candidateApplications').addEventListener('click', async event => {
        const action = event.target.closest('[data-application-action]');
        if (!action || action.disabled) return;
        try {
          await HiringData.decideApplication(action.dataset.applicationId, action.dataset.applicationAction);
          await renderProfile();
        } catch {
          candidateProfile.innerHTML = '<p class="empty-message">Não foi possível atualizar a candidatura. Tente novamente.</p>';
        }
      });
    }

    renderProfile().catch(() => {
      candidateProfile.innerHTML = '<p class="empty-message">Não foi possível carregar os dados. Tente novamente.</p>';
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
