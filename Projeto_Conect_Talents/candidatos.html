<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulte candidatos e acesse seus perfis na plataforma ConectaTalentos.">
  <title>Candidatos — ConectaTalentos</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script>if (!AuthData.isAutenticado()) window.location.replace('login.html');</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="header-container"></div>

      <main class="page-content">
        <h1 class="page-title">Candidatos</h1>
        <p class="page-subtitle">Encontre os melhores talentos para a sua empresa.</p>

        <!-- Barra de busca e filtros -->
        <div class="search-bar">
          <div class="search-bar__input-wrapper">
            <span class="search-bar__icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input
              type="search"
              class="search-bar__input"
              placeholder="Buscar por nome, cargo ou habilidade..."
              id="search-candidatos"
              aria-label="Buscar candidatos"
            >
          </div>
          <button class="filter-btn" aria-label="Filtros">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            Filtros
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <button class="filter-btn" aria-label="Vagas">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Todas as vagas
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>

        <div class="candidatos-layout">
          <!-- Coluna principal: listagem -->
          <div class="candidatos-main">
            <!-- Lista renderizada via JS -->
            <div id="candidatos-list"></div>
          </div>

          <!-- Coluna lateral -->
          <aside class="candidatos-sidebar">
            <!-- Total de candidatos -->
            <div class="card total-card">
              <div class="total-card__icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              </div>
              <div class="total-card__label">Total de candidatos</div>
              <div class="total-card__value" id="total-candidatos">47</div>
              <span class="trend" style="justify-content:center">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                <span id="crescimento-candidatos">+12% em relação ao mês anterior</span>
              </span>
            </div>

            <!-- Filtrar por status -->
            <div class="card filter-status-card">
              <h3 class="filter-status-card__title">Filtrar por status</h3>
              <div id="status-filters"></div>
            </div>

            <!-- CTA -->
            <div class="card cta-card">
              <div class="cta-card__bg"></div>
              <img
                class="cta-card__image"
                src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=300&h=400&fit=crop&crop=face"
                alt="Profissional sorrindo"
                loading="lazy"
              >
              <div class="cta-card__content">
                <h3 class="cta-card__title">Mais talentos para o seu futuro.</h3>
                <p class="cta-card__text">Conecte-se com profissionais qualificados e encontre o candidato ideal.</p>
                <a href="vagas.html" class="btn btn--white">Ver vagas &gt;</a>
              </div>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/hiring-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    initLayout('candidatos');

    const statusDefinitions = [
      { status: 'disponivel', label: 'Disponível', cor: 'green' },
      { status: 'avaliacao', label: 'Em avaliação', cor: 'blue' },
      { status: 'indisponivel', label: 'Indisponível', cor: 'purple' },
      { status: 'sem_info', label: 'Sem informação', cor: 'gray' }
    ];

    /* Filtros de status */
    const statusFilters = document.getElementById('status-filters');
    statusFilters.innerHTML = statusDefinitions.map(f => `
      <div class="filter-status-item" data-status="${f.status}" role="button" tabindex="0" aria-pressed="false">
        <span class="filter-status-item__label">
          <span class="status-dot status-dot--${f.cor}"></span>
          ${f.label}
        </span>
        <span class="filter-status-item__count">${f.count}</span>
      </div>
    `).join('');

    /* Renderiza card de candidato */
    function renderCandidatoCard(c) {
      const safe = HiringData.escapeHtml;
      return `
        <div class="card candidato-card" data-candidato-id="${c.id}" data-status="${c.status}">
          <input type="checkbox" class="candidato-card__checkbox" aria-label="Selecionar ${c.nome}">
          <img class="candidato-card__avatar" src="${safe(c.avatar)}" alt="Foto de ${safe(c.nome)}" loading="lazy">
          <div class="candidato-card__info">
            <div class="candidato-card__name">${safe(c.nome)}</div>
            <div class="candidato-card__role">${safe(c.cargo)}</div>
            <span class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              ${safe(c.localizacao)}
            </span>
            <div class="candidato-card__skills">
              ${c.habilidades.map(h => `<span class="skill-tag">${safe(h)}</span>`).join('')}
            </div>
          </div>
          <div class="candidato-card__status">
            ${renderStatusBadge(c.status, safe(c.statusLabel))}
          </div>
          <div class="candidato-card__action">
            <a href="perfil-candidato.html?id=${c.id}" class="btn btn--outline">
              Ver perfil
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </a>
          </div>
        </div>
      `;
    }

    const candidatosList = document.getElementById('candidatos-list');
    let todosCandidatos = [];
    let filtroStatusAtivo = null;
    candidatosList.innerHTML = '<p class="empty-message">Carregando...</p>';

    function renderLista(candidatos) {
      candidatosList.innerHTML = candidatos.length
        ? candidatos.map(renderCandidatoCard).join('')
        : '<p class="empty-message">Nenhum candidato encontrado.</p>';
    }

    /* Busca local */
    document.getElementById('search-candidatos').addEventListener('input', function () {
      const termo = this.value.toLowerCase();
      let filtrados = todosCandidatos.filter(c =>
        c.nome.toLowerCase().includes(termo) ||
        c.cargo.toLowerCase().includes(termo) ||
        c.habilidades.some(h => h.toLowerCase().includes(termo))
      );
      if (filtroStatusAtivo) {
        filtrados = filtrados.filter(c => c.status === filtroStatusAtivo);
      }
      renderLista(filtrados);
    });

    /* Filtro por status (clique lateral) */
    statusFilters.addEventListener('click', function (e) {
      const item = e.target.closest('.filter-status-item');
      if (!item) return;

      const status = item.dataset.status;
      if (filtroStatusAtivo === status) {
        filtroStatusAtivo = null;
        statusFilters.querySelectorAll('.filter-status-item').forEach(el => {
          el.style.opacity = '1';
          el.setAttribute('aria-pressed', 'false');
        });
        renderLista(todosCandidatos);
      } else {
        filtroStatusAtivo = status;
        statusFilters.querySelectorAll('.filter-status-item').forEach(el => {
          const selected = el.dataset.status === status;
          el.style.opacity = selected ? '1' : '0.5';
          el.setAttribute('aria-pressed', String(selected));
        });
        const filtrados = todosCandidatos.filter(c => c.status === status);
        renderLista(filtrados);
      }
    });

    statusFilters.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const item = event.target.closest('.filter-status-item');
      if (!item) return;
      event.preventDefault();
      item.click();
    });

    (async function carregarCandidatos() {
      try {
        todosCandidatos = await HiringData.getCandidates();
        document.getElementById('total-candidatos').textContent = todosCandidatos.length;
        document.getElementById('crescimento-candidatos').textContent = 'Candidatos das suas vagas';
        statusFilters.innerHTML = statusDefinitions.map(filter => {
          const count = todosCandidatos.filter(candidate => candidate.status === filter.status).length;
          return `<div class="filter-status-item" data-status="${filter.status}" role="button" tabindex="0" aria-pressed="false"><span class="filter-status-item__label"><span class="status-dot status-dot--${filter.cor}"></span>${filter.label}</span><span class="filter-status-item__count">${count}</span></div>`;
        }).join('');
        renderLista(todosCandidatos);
      } catch {
        candidatosList.innerHTML = '<p class="empty-message">Não foi possível carregar os dados. Tente novamente.</p>';
        document.getElementById('total-candidatos').textContent = '—';
      }
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
