<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gerencie as vagas publicadas pela sua empresa no ConectaTalentos.">
  <title>Vagas — ConectaTalentos</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script>if (!AuthData.isAutenticado()) window.location.replace('login.html');</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="header-container"></div>

      <main class="page-content">
        <div class="page-heading-row">
          <div>
            <h1 class="page-title">Vagas</h1>
            <p class="page-subtitle">Gerencie as oportunidades da sua empresa.</p>
          </div>
          <a class="btn btn--primary" href="cadastro-vaga.html">
            <span aria-hidden="true">+</span> Nova vaga
          </a>
        </div>

        <!-- Barra de busca e filtros -->
        <div class="search-bar">
          <div class="search-bar__input-wrapper">
            <span class="search-bar__icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input
              type="search"
              class="search-bar__input"
              placeholder="Buscar por cargo, cidade ou palavra-chave..."
              id="search-vagas"
              aria-label="Buscar vagas"
            >
          </div>
          <button class="filter-btn" aria-label="Filtros">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            Filtros
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <button class="filter-btn" aria-label="Localizações">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Todas as localizações
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>

        <div class="vagas-layout">
          <!-- Coluna principal: listagem -->
          <div class="vagas-main">
            <div class="vagas-main__header">
              <div class="vagas-main__title-row">
                <h2 class="vagas-main__title">Vagas disponíveis</h2>
                <span class="badge badge--count" id="vacancyCount">0</span>
              </div>
              <button class="sort-btn" aria-label="Ordenar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="8" y2="18"/></svg>
                Mais recentes
              </button>
            </div>

            <!-- Lista de vagas (renderizada via JS) -->
            <div id="vagas-list"></div>
          </div>

          <!-- Coluna lateral -->
          <aside class="vagas-sidebar">
            <!-- Hero card -->
            <div class="hero-card">
              <h3 class="hero-card__title">O seu próximo passo pode estar aqui!</h3>
              <p class="hero-card__text">Explore novas oportunidades e construa o seu futuro.</p>
              <div class="hero-card__illustration">
                <svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="50" cy="40" r="30" fill="#F5DDD3" opacity="0.7"/>
                  <circle cx="50" cy="40" r="20" fill="#FFB28C" opacity="0.75"/>
                  <circle cx="50" cy="40" r="10" fill="#E8541D"/>
                  <path d="M50 10 L55 35 L80 40 L55 45 L50 70 L45 45 L20 40 L45 35 Z" fill="#FF6B2C" opacity="0.9"/>
                </svg>
              </div>
            </div>

            <!-- Mais visualizadas -->
            <div class="card most-viewed-card">
              <h3 class="most-viewed-card__title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
                Mais visualizadas
              </h3>
              <div id="most-viewed-list"></div>
            </div>

            <!-- Dica -->
            <div class="card tip-card">
              <div class="tip-card__header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>
                <span class="tip-card__title">Dica</span>
              </div>
              <p class="tip-card__text">Mantenha seu perfil atualizado para receber recomendações de vagas compatíveis com o seu perfil.</p>
              <a href="#" class="chevron-btn" aria-label="Saiba mais">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </a>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/hiring-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    initLayout('vagas');

    /* Renderiza listagem de vagas */
    const vagasList = document.getElementById('vagas-list');
    let todasVagas = [];
    const safe = HiringData.escapeHtml;
    const mostViewedList = document.getElementById('most-viewed-list');
    vagasList.innerHTML = '<p class="empty-message">Carregando...</p>';

    function renderVagaCard(vaga) {
      return `
        <div class="card vaga-card" data-vaga-id="${vaga.id}">
          ${renderJobIcon(vaga)}
          <div class="vaga-card__info">
            <div class="vaga-card__title">${safe(vaga.titulo)}</div>
            <div class="vaga-card__company">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/></svg>
              ${safe(vaga.empresa)}
            </div>
            <div class="meta-info">
              <span class="meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                ${safe(vaga.localizacao)}
              </span>
              <span class="meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
                ${safe(vaga.tipo)}
              </span>
              <span class="meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Encerra em ${HiringData.formatDate(vaga.dataFim)}
              </span>
            </div>
          </div>
          <div class="vaga-card__actions">
            ${renderCandidaturasBadge(vaga)}
            ${renderJobStatus(vaga.status)}
            <a href="cadastro-vaga.html?id=${vaga.id}" class="btn btn--outline">Editar</a>
            ${vaga.status === 'Encerrada' ? `<button class="btn btn--decline" type="button" aria-label="Excluir vaga" title="Excluir vaga" data-vaga-id="${vaga.id}" data-vaga-action="delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>` : ''}
            <a href="detalhes-vaga.html?id=${vaga.id}" class="vaga-card__details-link">
              Ver detalhes
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </a>
          </div>
        </div>
      `;
    }

    vagasList.innerHTML = '<p class="empty-message">Carregando...</p>';

    vagasList.addEventListener('click', async event => {
      const deleteButton = event.target.closest('[data-vaga-action="delete"]');
      if (!deleteButton) return;

      try {
        const vacancy = await HiringData.getVacancy(deleteButton.dataset.vagaId);
        if (!vacancy || vacancy.status !== 'Encerrada') return;
        if (!confirm(`Tem certeza que deseja excluir a vaga "${vacancy.titulo}"? Essa ação não pode ser desfeita.`)) return;
        await HiringData.deleteVacancy(vacancy.id);
        todasVagas = await HiringData.getVacancies();
        renderVagas();
      } catch (error) {
        vagasList.innerHTML = `<p class="empty-message">${safe(error.message || 'Não foi possível excluir a vaga.')}</p>`;
      }
    });

    /* Mais visualizadas (top 4 por candidaturas) */
    const topVagas = [...todasVagas].sort((a, b) => b.candidaturas - a.candidaturas).slice(0, 4);

    mostViewedList.innerHTML = topVagas.map(vaga => `
      <a class="most-viewed-item" href="detalhes-vaga.html?id=${vaga.id}">
        <div class="most-viewed-item__icon job-icon job-icon--${vaga.cor}" style="width:36px;height:36px;font-size:0.75rem">
          ${JOB_ICONS[vaga.icone]}
        </div>
        <div class="most-viewed-item__info">
          <div class="most-viewed-item__title">${safe(vaga.titulo)}</div>
          <div class="most-viewed-item__count">${vaga.candidaturas} candidaturas</div>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
    `).join('');

    function renderVagas(vagas = todasVagas) {
      vagasList.innerHTML = vagas.length
        ? vagas.map(renderVagaCard).join('')
        : '<p class="empty-message">Nenhuma vaga encontrada.</p>';
      document.getElementById('vacancyCount').textContent = vagas.length;
      const top = [...todasVagas].sort((a, b) => b.candidaturas - a.candidaturas).slice(0, 4);
      mostViewedList.innerHTML = top.map(vaga => `
        <a class="most-viewed-item" href="detalhes-vaga.html?id=${vaga.id}">
          <div class="most-viewed-item__icon job-icon job-icon--${vaga.cor}" style="width:36px;height:36px;font-size:0.75rem">${JOB_ICONS[vaga.icone]}</div>
          <div class="most-viewed-item__info">
            <div class="most-viewed-item__title">${safe(vaga.titulo)}</div>
            <div class="most-viewed-item__count">${vaga.candidaturas} candidaturas</div>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
      `).join('');
    }

    /* Busca simples no front-end (filtro local) */
    document.getElementById('search-vagas').addEventListener('input', function () {
      const termo = this.value.toLowerCase();
      const filtradas = todasVagas.filter(v =>
        v.titulo.toLowerCase().includes(termo) ||
        v.empresa.toLowerCase().includes(termo) ||
        v.localizacao.toLowerCase().includes(termo)
      );
      renderVagas(filtradas);
    });

    (async function carregarVagas() {
      try {
        todasVagas = await HiringData.getVacancies();
        renderVagas();
      } catch {
        vagasList.innerHTML = '<p class="empty-message">Não foi possível carregar os dados. Tente novamente.</p>';
        mostViewedList.innerHTML = '';
      }
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
